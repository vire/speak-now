<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speak Now</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7fb; color: #202432; }
      main { margin: 1.5rem; max-width: 34rem; padding: 3rem; background: white; border-radius: 1rem; box-shadow: 0 8px 30px #20243212; text-align: center; }
      audio { display: block; max-width: 100%; margin: 1rem auto; }
      .rooms { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; }
      .rooms button { background: #edf0f7; color: #202432; }
      .rooms button[aria-pressed="true"] { background: #202432; color: white; }
      .room { margin: 1.5rem 0; text-align: left; }
      .room h2 { font-size: 1.2rem; }
      .room ul { padding-left: 1.25rem; line-height: 1.5; }
      .room li + li { margin-top: .75rem; }
      button { font: inherit; font-weight: 600; padding: .65rem 1.2rem; border: 0; border-radius: .5rem; background: #202432; color: white; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      button:focus-visible { outline: 3px solid #5b77d1; outline-offset: 3px; }
      .status { font-size: .85rem; color: #596071; }
      @media (max-width: 480px) { main { padding: 1.5rem; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/assets/client.js"></script>
  </body>
</html>
