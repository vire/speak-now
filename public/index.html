<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speak Now</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #e0e5ef; background: #10141d; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { max-width: 1600px; margin: 0 auto; padding: 0 32px 32px; }
      .toolbar { min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #293140; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-icon { color: #80baff; font-size: 28px; letter-spacing: -5px; margin-right: 5px; }
      h1 { font-size: 19px; letter-spacing: -.5px; margin: 0; }
      .demo-badge { font-size: 10px; letter-spacing: 1px; border: 1px solid #3b4659; color: #a0acc0; padding: 3px 6px; border-radius: 4px; }
      .server-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #a0acc0; }
      .dot { display: inline-block; width: 7px; height: 7px; flex-shrink: 0; border-radius: 50%; background: #65d6ac; }
      .dot.busy { background: #e9bc6a; }
      .server-heading { display: flex; justify-content: space-between; align-items: end; gap: 12px; padding: 36px 0 24px; }
      .eyebrow, .channel-number { font-size: 10px; letter-spacing: 1.5px; color: #93a0b6; }
      h2 { margin: 7px 0 0; font-size: 27px; font-weight: 600; letter-spacing: -.8px; }
      .room-count { font-size: 12px; color: #93a0b6; }
      .channels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
      .channel { min-width: 0; display: flex; flex-direction: column; background: #1a202c; border: 1px solid #303a4b; border-radius: 8px; overflow: hidden; }
      .channel.selected { border-color: #5e8fca; }
      .channel-heading { display: flex; align-items: center; gap: 10px; min-height: 87px; padding: 18px 16px; background: #202838; border-bottom: 1px solid #303a4b; }
      .channel-icon { color: #8cb8ed; font-size: 20px; }
      h3 { font-size: 15px; font-weight: 600; margin: 4px 0 0; }
      .channel-number { font-size: 9px; letter-spacing: 1px; }
      .message-count { margin-left: auto; color: #9eacc1; background: #313c50; border-radius: 5px; padding: 3px 7px; font-size: 11px; }
      .updates { list-style: none; padding: 0; margin: 0; flex: 1; }
      .updates li { padding: 18px 16px; border-bottom: 1px solid #293242; min-height: 150px; }
      .updates li.active-update { background: #24374b; box-shadow: inset 3px 0 #80baff; }
      .update-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: #b3bfd2; }
      .avatar { font-size: 9px; background: #303e53; color: #a6c4e8; width: 23px; height: 23px; display: grid; place-items: center; border-radius: 5px; }
      .sample-label { margin-left: auto; font-size: 10px; font-weight: 400; color: #93a0b6; }
      .updates p { color: #c0cada; font-size: 13px; line-height: 1.65; margin: 12px 0 0; }
      button { font: inherit; cursor: pointer; }
      .play-button { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 16px; border: 1px solid #435978; border-radius: 5px; padding: 11px; color: #c2ddff; background: #273950; font-size: 12px; font-weight: 600; }
      .play-button:hover { background: #344d6b; border-color: #80baff; }
      button:disabled { opacity: .5; cursor: wait; }
      button:focus-visible { outline: 2px solid #9dcbff; outline-offset: 3px; }
      .playback { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; padding: 20px; border: 1px solid #303a4b; border-radius: 8px; background: #171d28; }
      .playback-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 220px; }
      .playback strong { font-size: 12px; font-weight: 600; }
      .playback p { margin: 5px 0 0; font-size: 12px; color: #a0acc0; line-height: 1.5; }
      audio { max-width: 100%; width: 300px; height: 36px; }
      .playback .error { color: #ffb1b1; flex-basis: 100%; }
      @media (max-width: 1050px) { .channels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 600px) { main { padding: 0 16px 20px; } .channels { grid-template-columns: 1fr; } .server-heading { align-items: start; flex-direction: column; padding-top: 24px; } .server-status { display: none; } .updates li { min-height: auto; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/assets/client.js"></script>
  </body>
</html>
